[workspace]
resolver = "3"
members = [
    "apps/tayassu",
    "crates/tayassu-core",
    "crates/tayassu-providers",
    "crates/tayassu-store",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"
repository = "https://github.com/Lucas-BRT/tayassu"

[workspace.dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
clap_complete = { version = "4.6.9", features = ["unstable-dynamic"] }
ctrlc = "3.2"
crossterm = "0.28"
ratatui = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.19"
thiserror = "2.0"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

tayassu-core = { path = "crates/tayassu-core" }
tayassu-providers = { path = "crates/tayassu-providers" }
tayassu-store = { path = "crates/tayassu-store" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"

[profile.dev]
debug = 0

[profile.dev.package."*"]
debug = false

[profile.release]
strip = true
lto = "thin"
codegen-units = 16
