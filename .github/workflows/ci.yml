name: CI

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"

jobs:
  check:
    name: Format, clippy, and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        # v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Activate pinned Rust toolchain
        run: cargo --version

      - name: Cache Cargo artifacts
        # v2.7.8
        uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6
        with:
          shared-key: tayassu

      - name: Install cargo-nextest
        # v2.90.11
        uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83
        with:
          tool: nextest@0.9.149

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo nextest run --locked --workspace

      - name: Test installer and packaging
        run: |
          shellcheck install.sh tools/package-release.sh tools/test-install.sh
          bash tools/test-install.sh
